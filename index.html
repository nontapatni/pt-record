<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPD/OPD Case Record</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .form-input {
            @apply w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app" class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">ระบบบันทึกเคสผู้ป่วย IPD/OPD</h1>
            <p id="user-id-display" class="text-sm text-gray-500 mt-2">กำลังตรวจสอบสิทธิ์...</p>
        </header>

        <!-- Input Form Section -->
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-6 text-blue-600 border-b pb-3">บันทึกข้อมูลเคสใหม่</h2>
            <form id="recordForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- HN / Patient ID -->
                    <div>
                        <label for="hn" class="block text-sm font-medium text-gray-700 mb-1">รหัสผู้ป่วย (HN)</label>
                        <input type="text" id="hn" name="hn" class="form-input" placeholder="ตัวอย่าง: 123456" required>
                    </div>

                    <!-- Full Name -->
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                        <input type="text" id="fullName" name="fullName" class="form-input" placeholder="ตัวอย่าง: สมชาย ใจดี" required>
                    </div>

                    <!-- Case Type -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">ประเภทเคส</label>
                        <div class="flex space-x-6">
                            <label class="inline-flex items-center">
                                <input type="radio" name="caseType" value="IPD" class="text-red-500 focus:ring-red-500 h-4 w-4" required>
                                <span class="ml-2 text-gray-700 font-medium">IPD (ผู้ป่วยใน)</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="caseType" value="OPD" class="text-green-500 focus:ring-green-500 h-4 w-4" required checked>
                                <span class="ml-2 text-gray-700 font-medium">OPD (ผู้ป่วยนอก)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Chief Complaint (CC) -->
                    <div class="md:col-span-2">
                        <label for="cc" class="block text-sm font-medium text-gray-700 mb-1">อาการสำคัญ (CC)</label>
                        <textarea id="cc" name="cc" rows="2" class="form-input" placeholder="ตัวอย่าง: ปวดท้องใต้ลิ้นปี่ 3 วัน ก่อนมาโรงพยาบาล" required></textarea>
                    </div>

                    <!-- Diagnosis (Dx) -->
                    <div class="md:col-span-2">
                        <label for="dx" class="block text-sm font-medium text-gray-700 mb-1">การวินิจฉัย (Dx)</label>
                        <textarea id="dx" name="dx" rows="2" class="form-input" placeholder="ตัวอย่าง: Acute Appendicitis" required></textarea>
                    </div>

                    <!-- Date -->
                    <div>
                        <label for="recordDate" class="block text-sm font-medium text-gray-700 mb-1">วันที่รับ/วันที่มาตรวจ</label>
                        <input type="date" id="recordDate" name="recordDate" class="form-input" required>
                    </div>
                </div>

                <div class="mt-8">
                    <button type="submit" id="saveButton" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md shadow-blue-200">
                        บันทึกเคส
                    </button>
                    <div id="messageBox" class="mt-3 text-center text-sm font-medium hidden"></div>
                </div>
            </form>
        </div>

        <!-- Records List Section -->
        <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg">
            <h2 class="text-xl font-semibold mb-6 text-gray-800 border-b pb-3">รายการเคสที่บันทึกไว้</h2>
            <div id="recordsList" class="space-y-4">
                <p class="text-center text-gray-500" id="loadingMessage">กำลังโหลดข้อมูล...</p>
                <!-- Records will be injected here -->
            </div>
            <p id="noRecordsMessage" class="text-center text-gray-500 hidden mt-4">ยังไม่มีการบันทึกเคส</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            onSnapshot, 
            orderBy, 
            serverTimestamp,
            getDocs,
            deleteDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ตั้งค่า Logging ให้แสดงผล
        setLogLevel('Debug');

        // Global Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth, userId = null;
        let isAuthReady = false;

        // Elements
        const recordForm = document.getElementById('recordForm');
        const recordsList = document.getElementById('recordsList');
        const loadingMessage = document.getElementById('loadingMessage');
        const noRecordsMessage = document.getElementById('noRecordsMessage');
        const userIdDisplay = document.getElementById('user-id-display');
        const messageBox = document.getElementById('messageBox');
        const saveButton = document.getElementById('saveButton');

        // Firestore Collection Path (Public data for sharing)
        const COLLECTION_PATH = `artifacts/${appId}/public/data/patient_records`;

        /**
         * แปลงวันที่เป็นรูปแบบ Thai locale
         * @param {Date} dateObj - วัตถุ Date
         * @returns {string} วันที่ในรูปแบบ 1 ม.ค. 2567
         */
        function formatDate(dateObj) {
            if (!dateObj) return '';
            try {
                // Adjust for Thai Buddhist year (พ.ศ.)
                return dateObj.toLocaleDateString('th-TH', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            } catch (e) {
                console.error("Error formatting date:", e);
                return dateObj.toDateString();
            }
        }


        /**
         * เริ่มต้นการทำงานของ Firebase และการยืนยันตัวตน
         */
        async function initializeAppAndAuth() {
            if (Object.keys(firebaseConfig).length === 0) {
                console.error("Firebase configuration is missing.");
                userIdDisplay.textContent = "Error: Firebase config หายไป";
                loadingMessage.textContent = "ไม่สามารถโหลดข้อมูลได้เนื่องจากการตั้งค่า Firebase ไม่สมบูรณ์";
                return;
            }

            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // 1. ตรวจสอบสถานะการยืนยันตัวตน
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    userIdDisplay.textContent = `User ID: ${userId}`;
                    isAuthReady = true;
                    console.log("Authentication successful. User ID:", userId);
                    loadRecords();
                } else {
                    // 2. หากยังไม่ได้รับโทเคน ให้ลงชื่อเข้าใช้แบบไม่ระบุตัวตน
                    try {
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Error signing in:", error);
                        userIdDisplay.textContent = "Error: ไม่สามารถลงชื่อเข้าใช้";
                        loadingMessage.textContent = "ไม่สามารถโหลดข้อมูลได้เนื่องจากการตรวจสอบสิทธิ์ล้มเหลว";
                        isAuthReady = true;
                    }
                }
            });
        }

        /**
         * บันทึกข้อมูลเคสลงใน Firestore
         * @param {Event} e - event การ submit form
         */
        async function saveRecord(e) {
            e.preventDefault();

            if (!isAuthReady || !userId) {
                showMessage("กำลังตรวจสอบสิทธิ์ กรุณารอสักครู่...", "yellow");
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "กำลังบันทึก...";
            showMessage("", "hidden");

            const formData = new FormData(recordForm);
            const data = {
                hn: formData.get('hn').trim(),
                fullName: formData.get('fullName').trim(),
                caseType: formData.get('caseType'),
                cc: formData.get('cc').trim(),
                dx: formData.get('dx').trim(),
                date: formData.get('recordDate'),
                userId: userId, // บันทึก ID ผู้ใช้งานที่สร้าง
                timestamp: serverTimestamp() // เวลาเซิร์ฟเวอร์สำหรับลำดับ
            };

            try {
                const docRef = await addDoc(collection(db, COLLECTION_PATH), data);
                console.log("Document written with ID: ", docRef.id);
                recordForm.reset();
                // Set today's date back for convenience
                document.getElementById('recordDate').valueAsDate = new Date(); 
                showMessage("บันทึกเคสสำเร็จ!", "green");
            } catch (error) {
                console.error("Error adding document: ", error);
                showMessage(`เกิดข้อผิดพลาดในการบันทึก: ${error.message}`, "red");
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "บันทึกเคส";
            }
        }
        
        /**
         * แสดงข้อความสถานะ
         * @param {string} message - ข้อความที่ต้องการแสดง
         * @param {('green'|'red'|'yellow'|'hidden')} type - ประเภทของข้อความสำหรับสี
         */
        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = "mt-3 text-center text-sm font-medium";
            
            if (type === 'hidden') {
                messageBox.classList.add('hidden');
                return;
            }

            if (type === 'green') {
                messageBox.classList.add('text-green-700', 'bg-green-100', 'p-2', 'rounded');
            } else if (type === 'red') {
                messageBox.classList.add('text-red-700', 'bg-red-100', 'p-2', 'rounded');
            } else if (type === 'yellow') {
                messageBox.classList.add('text-yellow-700', 'bg-yellow-100', 'p-2', 'rounded');
            }
            messageBox.classList.remove('hidden');
        }

        /**
         * สร้าง UI สำหรับรายการเคส
         * @param {Object} record - ข้อมูลเคส
         * @param {string} id - Document ID
         * @returns {string} HTML string
         */
        function createRecordCard(record, id) {
            const isIPD = record.caseType === 'IPD';
            const badgeColor = isIPD ? 'bg-red-500' : 'bg-green-500';
            const dateText = record.timestamp ? formatDate(record.timestamp.toDate()) : 'N/A';
            const recordDate = record.date || 'ไม่ระบุ';

            // Card structure
            return `
                <div class="case-card bg-gray-50 p-4 border-l-4 ${isIPD ? 'border-red-500' : 'border-green-500'} rounded-lg shadow-sm hover:shadow-md transition duration-200">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full text-white ${badgeColor}">
                            ${record.caseType}
                        </span>
                        <div class="text-right">
                            <button data-id="${id}" class="delete-btn text-gray-400 hover:text-red-600 transition duration-150 text-xl font-bold leading-none" title="ลบเคส">
                                &times;
                            </button>
                        </div>
                    </div>
                    
                    <p class="text-lg font-bold text-gray-800">${record.fullName} (HN: ${record.hn})</p>
                    
                    <div class="mt-2 space-y-1 text-sm text-gray-600">
                        <p><span class="font-medium text-gray-700">วันที่:</span> ${recordDate} (${isIPD ? 'รับไว้' : 'มาตรวจ'})</p>
                        <p><span class="font-medium text-gray-700">CC:</span> ${record.cc}</p>
                        <p><span class="font-medium text-gray-700">Dx:</span> ${record.dx}</p>
                    </div>
                    <p class="text-xs text-gray-400 mt-3 border-t pt-2">
                        บันทึกโดย ${record.userId.substring(0, 8)}... เมื่อ: ${dateText}
                    </p>
                </div>
            `;
        }

        /**
         * ลบเอกสารออกจาก Firestore
         * @param {string} id - Document ID ที่จะลบ
         */
        async function deleteRecord(id) {
            if (!isAuthReady || !userId) {
                showMessage("การตรวจสอบสิทธิ์ยังไม่เสร็จสิ้น", "red");
                return;
            }

            // ใช้การยืนยันแบบ Modal (แทน alert/confirm ที่ไม่สามารถใช้ได้ใน iframe)
            const isConfirmed = window.confirm("คุณแน่ใจหรือไม่ว่าต้องการลบเคสนี้?");
            
            if (isConfirmed) {
                try {
                    await deleteDoc(doc(db, COLLECTION_PATH, id));
                    showMessage("ลบเคสสำเร็จ!", "green");
                } catch (error) {
                    console.error("Error deleting document: ", id, error);
                    showMessage(`เกิดข้อผิดพลาดในการลบ: ${error.message}`, "red");
                }
            }
        }

        /**
         * โหลดข้อมูลเคสแบบ Real-time ด้วย onSnapshot
         */
        function loadRecords() {
            if (!isAuthReady || !userId || !db) return;

            // คิวรี: เรียงลำดับตามวันที่บันทึก (timestamp) ล่าสุดขึ้นก่อน
            const q = query(collection(db, COLLECTION_PATH), orderBy("timestamp", "desc"));

            // เริ่มการฟังข้อมูลแบบ Real-time
            onSnapshot(q, (snapshot) => {
                loadingMessage.classList.add('hidden');
                
                if (snapshot.empty) {
                    recordsList.innerHTML = '';
                    noRecordsMessage.classList.remove('hidden');
                    return;
                }

                noRecordsMessage.classList.add('hidden');
                let htmlContent = '';
                snapshot.forEach((doc) => {
                    const record = doc.data();
                    htmlContent += createRecordCard(record, doc.id);
                });
                
                recordsList.innerHTML = htmlContent;
            }, (error) => {
                console.error("Error listening to collection:", error);
                loadingMessage.textContent = `เกิดข้อผิดพลาดในการโหลด: ${error.message}`;
            });
        }

        // Event Listeners
        recordForm.addEventListener('submit', saveRecord);

        // Delegation สำหรับปุ่มลบ (เนื่องจากมีการเพิ่มปุ่มลบเข้ามาใหม่เรื่อยๆ)
        recordsList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const docId = e.target.getAttribute('data-id');
                if (docId) {
                    deleteRecord(docId);
                }
            }
        });
        
        // กำหนดวันที่เริ่มต้นให้เป็นวันนี้
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('recordDate').valueAsDate = new Date();
        });

        // Start the application
        initializeAppAndAuth();

    </script>
</body>
</html>

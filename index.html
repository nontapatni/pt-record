<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPD/OPD Case Record</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .form-input {
            @apply w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150;
        }
        .case-card {
            border-left-width: 6px;
            transition: all 0.2s ease-in-out;
        }
        .case-card.ipd { border-left-color: #ef4444; /* Red-500 */ }
        .case-card.opd { border-left-color: #10b981; /* Green-500 */ }
        .case-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app" class="max-w-4xl mx-auto">
        
        <!-- Login/Signup Screen -->
        <div id="authScreen" class="flex flex-col items-center justify-center min-h-[60vh]">
            <div class="bg-white p-8 md:p-10 rounded-xl shadow-2xl w-full max-w-sm">
                <h2 id="authTitle" class="text-2xl font-bold text-gray-800 text-center mb-6">เข้าสู่ระบบ</h2>
                
                <form id="authForm">
                    <div class="space-y-4">
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                            <input type="email" id="email" class="form-input" placeholder="example@hospital.com" required>
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (ขั้นต่ำ 6 ตัวอักษร)</label>
                            <input type="password" id="password" class="form-input" placeholder="รหัสผ่าน" required>
                        </div>
                    </div>
                    
                    <div id="authMessage" class="mt-4 text-center text-sm font-medium hidden"></div>

                    <button type="submit" id="authButton" class="w-full mt-6 bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md">
                        เข้าสู่ระบบ
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <button id="authToggle" class="text-sm text-blue-600 hover:text-blue-800 transition duration-150">
                        ยังไม่มีบัญชี? <span class="font-semibold">สร้างบัญชีใหม่</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Application Screen (Case Record) -->
        <div id="appScreen" class="hidden">
            <header class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">ระบบบันทึกเคสผู้ป่วย IPD/OPD</h1>
                <p id="user-id-display" class="text-sm text-gray-500 mt-2">User ID: N/A</p>
                <button id="signOutButton" class="text-xs text-red-500 hover:text-red-700 mt-1">ออกจากระบบ</button>
            </header>

            <!-- Input Form Section -->
            <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg mb-8">
                <h2 class="text-xl font-semibold mb-6 text-blue-600 border-b pb-3">บันทึกข้อมูลเคสใหม่</h2>
                <form id="recordForm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <!-- HN / Patient ID -->
                        <div>
                            <label for="hn" class="block text-sm font-medium text-gray-700 mb-1">รหัสผู้ป่วย (HN)</label>
                            <input type="text" id="hn" name="hn" class="form-input" placeholder="ตัวอย่าง: 123456" required>
                        </div>

                        <!-- Full Name -->
                        <div>
                            <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                            <input type="text" id="fullName" name="fullName" class="form-input" placeholder="ตัวอย่าง: สมชาย ใจดี" required>
                        </div>

                        <!-- Case Type -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">ประเภทเคส</label>
                            <div class="flex space-x-6">
                                <label class="inline-flex items-center">
                                    <input type="radio" name="caseType" value="IPD" class="text-red-500 focus:ring-red-500 h-4 w-4" required>
                                    <span class="ml-2 text-gray-700 font-medium">IPD (ผู้ป่วยใน)</span>
                                </label>
                                <label class="inline-flex items-center">
                                    <input type="radio" name="caseType" value="OPD" class="text-green-500 focus:ring-green-500 h-4 w-4" required checked>
                                    <span class="ml-2 text-gray-700 font-medium">OPD (ผู้ป่วยนอก)</span>
                                </label>
                            </div>
                        </div>

                        <!-- Chief Complaint (CC) -->
                        <div class="md:col-span-2">
                            <label for="cc" class="block text-sm font-medium text-gray-700 mb-1">อาการสำคัญ (CC)</label>
                            <textarea id="cc" name="cc" rows="2" class="form-input" placeholder="ตัวอย่าง: ปวดท้องใต้ลิ้นปี่ 3 วัน ก่อนมาโรงพยาบาล" required></textarea>
                        </div>

                        <!-- Diagnosis (Dx) -->
                        <div class="md:col-span-2">
                            <label for="dx" class="block text-sm font-medium text-gray-700 mb-1">การวินิจฉัย (Dx)</label>
                            <textarea id="dx" name="dx" rows="2" class="form-input" placeholder="ตัวอย่าง: Acute Appendicitis" required></textarea>
                        </div>

                        <!-- Date -->
                        <div>
                            <label for="recordDate" class="block text-sm font-medium text-gray-700 mb-1">วันที่รับ/วันที่มาตรวจ</label>
                            <input type="date" id="recordDate" name="recordDate" class="form-input" required>
                        </div>
                    </div>

                    <div class="mt-8">
                        <button type="submit" id="saveButton" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md shadow-blue-200">
                            บันทึกเคส
                        </button>
                        <div id="messageBox" class="mt-3 text-center text-sm font-medium hidden"></div>
                    </div>
                </form>
            </div>

            <!-- Records List Section -->
            <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg">
                <h2 class="text-xl font-semibold mb-6 text-gray-800 border-b pb-3">รายการเคสที่บันทึกไว้ (ส่วนตัว)</h2>
                <div id="recordsList" class="space-y-4">
                    <p class="text-center text-gray-500" id="loadingMessage">กำลังโหลดข้อมูล...</p>
                    <!-- Records will be injected here -->
                </div>
                <p id="noRecordsMessage" class="text-center text-gray-500 hidden mt-4">ยังไม่มีการบันทึกเคส</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signOut,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            onSnapshot, 
            orderBy, 
            serverTimestamp,
            deleteDoc,
            doc,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ตั้งค่า Logging ให้แสดงผล
        setLogLevel('Debug');

        // ***************************************************************
        // *** 1. FIREBASE CONFIGURATION ***
        // ***************************************************************
        const appId = 'pt-record-78ade'; // ID ใช้ในการกำหนด Collection Path
        const firebaseConfig = {
            apiKey: "AIzaSyDEieoD4VojMcybDg_34-YoEM2d7s6JHPs", 
            authDomain: "pt-record-78ade.firebaseapp.com",
            projectId: "pt-record-78ade",
            storageBucket: "pt-record-78ade.firebasestorage.app",
            messagingSenderId: "821422410802",
            appId: "1:821422410802:web:fcbf85eeba91dba1c5002b"
        };
        // ***************************************************************

        let app, db, auth, userId = null;
        let isAuthReady = false; // สถานะการเชื่อมต่อ Firebase Auth
        let isSignUpMode = false; // สถานะ: false = Sign In, true = Sign Up

        // Elements
        const authScreen = document.getElementById('authScreen');
        const appScreen = document.getElementById('appScreen');
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authButton = document.getElementById('authButton');
        const authToggle = document.getElementById('authToggle');
        const authMessage = document.getElementById('authMessage');
        const signOutButton = document.getElementById('signOutButton');

        const recordForm = document.getElementById('recordForm');
        const recordsList = document.getElementById('recordsList');
        const loadingMessage = document.getElementById('loadingMessage');
        const noRecordsMessage = document.getElementById('noRecordsMessage');
        const userIdDisplay = document.getElementById('user-id-display');
        const messageBox = document.getElementById('messageBox');
        const saveButton = document.getElementById('saveButton');

        /**
         * กำหนดเส้นทางคอลเลกชัน Firestore ที่เป็นส่วนตัว (Private Data Path)
         * Path: /artifacts/{appId}/users/{userId}/patient_records
         */
        function getRecordsCollectionRef() {
            if (!db || !userId) {
                // หากยังไม่ล็อกอิน ให้ชี้ไปที่คอลเลกชันชั่วคราว (แต่ Security Rules จะบล็อก)
                return collection(db, `artifacts/${appId}/temp/patient_records`); 
            }
            const PRIVATE_PATH = `artifacts/${appId}/users/${userId}/patient_records`;
            return collection(db, PRIVATE_PATH);
        }

        // ------------------ UTILITY FUNCTIONS ------------------

        function formatDate(dateObj) {
            if (!dateObj) return '';
            try {
                return dateObj.toLocaleDateString('th-TH', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            } catch (e) {
                console.error("Error formatting date:", e);
                return dateObj.toDateString();
            }
        }

        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = "mt-3 text-center text-sm font-medium p-2 rounded";
            
            if (type === 'hidden') {
                element.classList.add('hidden');
                return;
            }

            const baseClasses = {
                'green': 'text-green-700 bg-green-100',
                'red': 'text-red-700 bg-red-100',
                'yellow': 'text-yellow-700 bg-yellow-100',
            };
            element.className += ` ${baseClasses[type]}`;
            element.classList.remove('hidden');
        }

        function createRecordCard(record, id) {
            const isIPD = record.caseType === 'IPD';
            const badgeColor = isIPD ? 'bg-red-500' : 'bg-green-500';
            const dateText = record.timestamp ? formatDate(record.timestamp.toDate()) : 'N/A';
            const recordDate = record.date || 'ไม่ระบุ';
            const shortUserId = record.userId ? record.userId.substring(0, 8) + '...' : 'Unknown'; 

            // Card structure
            return `
                <div class="case-card bg-gray-50 p-4 border-l-4 ${isIPD ? 'border-red-500' : 'border-green-500'} rounded-lg shadow-sm hover:shadow-md transition duration-200">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full text-white ${badgeColor}">
                            ${record.caseType}
                        </span>
                        <div class="text-right">
                            <button data-id="${id}" class="delete-btn text-gray-400 hover:text-red-600 transition duration-150 text-xl font-bold leading-none" title="ลบเคส">
                                &times;
                            </button>
                        </div>
                    </div>
                    
                    <p class="text-lg font-bold text-gray-800">${record.fullName} (HN: ${record.hn})</p>
                    
                    <div class="mt-2 space-y-1 text-sm text-gray-600">
                        <p><span class="font-medium text-gray-700">วันที่:</span> ${recordDate} (${isIPD ? 'รับไว้' : 'มาตรวจ'})</p>
                        <p><span class="font-medium text-gray-700">CC:</span> ${record.cc}</p>
                        <p><span class="font-medium text-gray-700">Dx:</span> ${record.dx}</p>
                    </div>
                    <p class="text-xs text-gray-400 mt-3 border-t pt-2">
                        บันทึกโดย ${shortUserId} เมื่อ: ${dateText}
                    </p>
                </div>
            `;
        }

        // ------------------ FIREBASE AUTH LOGIC ------------------

        /**
         * จัดการการลงชื่อเข้าใช้และการสร้างบัญชีใหม่
         */
        async function handleAuth(e) {
            e.preventDefault();
            
            authButton.disabled = true;
            authButton.textContent = isSignUpMode ? "กำลังสร้างบัญชี..." : "กำลังเข้าสู่ระบบ...";
            showMessage(authMessage, "", "hidden");

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if (isSignUpMode) {
                    // Sign Up (สร้างบัญชีใหม่)
                    await createUserWithEmailAndPassword(auth, email, password);
                    showMessage(authMessage, "สร้างบัญชีสำเร็จ! กำลังเข้าสู่ระบบ...", "green");
                } else {
                    // Sign In (เข้าสู่ระบบ)
                    await signInWithEmailAndPassword(auth, email, password);
                    showMessage(authMessage, "เข้าสู่ระบบสำเร็จ! กำลังโหลดข้อมูล...", "yellow");
                }
            } catch (error) {
                authButton.disabled = false;
                authButton.textContent = isSignUpMode ? "สร้างบัญชี" : "เข้าสู่ระบบ";

                let errorMessage = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = "อีเมลนี้ถูกใช้งานแล้ว กรุณาลองเข้าสู่ระบบ หรือใช้อีเมลอื่น";
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = "รูปแบบอีเมลไม่ถูกต้อง";
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found') {
                    errorMessage = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
                }
                
                showMessage(authMessage, `Error: ${errorMessage}`, "red");
                console.error("Auth Error:", error.code, error.message);
            }
        }

        /**
         * จัดการการออกจากระบบ
         */
        async function handleSignOut() {
            try {
                await signOut(auth);
                // onAuthStateChanged จะจัดการการเปลี่ยนหน้าจออัตโนมัติ
            } catch (error) {
                console.error("Sign Out Error:", error);
            }
        }

        // ------------------ FIREBASE DATA LOGIC ------------------

        /**
         * บันทึกข้อมูลเคสลงใน Firestore
         */
        async function saveRecord(e) {
            e.preventDefault();

            if (!isAuthReady || !userId) {
                showMessage(messageBox, "กรุณาล็อกอินก่อนบันทึกข้อมูล", "yellow");
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = "กำลังบันทึก...";
            showMessage(messageBox, "", "hidden");

            const formData = new FormData(recordForm);
            const data = {
                hn: formData.get('hn').trim(),
                fullName: formData.get('fullName').trim(),
                caseType: formData.get('caseType'),
                cc: formData.get('cc').trim(),
                dx: formData.get('dx').trim(),
                date: formData.get('recordDate'),
                userId: userId, 
                timestamp: serverTimestamp()
            };

            try {
                await addDoc(getRecordsCollectionRef(), data);
                recordForm.reset();
                document.getElementById('recordDate').valueAsDate = new Date(); 
                showMessage(messageBox, "บันทึกเคสสำเร็จ!", "green");
            } catch (error) {
                console.error("Error adding document: ", error);
                let errorMessage = "เกิดข้อผิดพลาดในการบันทึก";
                if (error.code === 'permission-denied') {
                    errorMessage = "สิทธิ์ในการบันทึกถูกปฏิเสธ (ตรวจสอบ Firestore Rules)";
                }
                showMessage(messageBox, `${errorMessage}: ${error.message}`, "red");
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "บันทึกเคส";
            }
        }
        
        /**
         * ลบเอกสารออกจาก Firestore
         */
        async function deleteRecord(id) {
            if (!isAuthReady || !userId) {
                showMessage(messageBox, "กรุณาล็อกอินก่อนดำเนินการ", "red");
                return;
            }

            if (window.confirm("คุณแน่ใจหรือไม่ว่าต้องการลบเคสนี้?")) {
                try {
                    const collectionRef = getRecordsCollectionRef();
                    await deleteDoc(doc(collectionRef, id)); 
                    showMessage(messageBox, "ลบเคสสำเร็จ!", "green");
                } catch (error) {
                    console.error("Error deleting document: ", id, error);
                    let errorMessage = "เกิดข้อผิดพลาดในการลบ";
                    if (error.code === 'permission-denied') {
                         errorMessage = "สิทธิ์ในการลบถูกปฏิเสธ (ตรวจสอบ Firestore Rules)";
                    }
                    showMessage(messageBox, `${errorMessage}: ${error.message}`, "red");
                }
            }
        }

        /**
         * โหลดข้อมูลเคสแบบ Real-time ด้วย onSnapshot
         */
        function loadRecords() {
            if (!isAuthReady || !userId || !db) return;

            const collectionRef = getRecordsCollectionRef();
            const q = query(collectionRef, orderBy("timestamp", "desc"));

            onSnapshot(q, (snapshot) => {
                loadingMessage.classList.add('hidden');
                
                if (snapshot.empty) {
                    recordsList.innerHTML = '';
                    noRecordsMessage.classList.remove('hidden');
                    return;
                }

                noRecordsMessage.classList.add('hidden');
                let htmlContent = '';
                snapshot.forEach((doc) => {
                    const record = doc.data();
                    htmlContent += createRecordCard(record, doc.id);
                });
                
                recordsList.innerHTML = htmlContent;
            }, (error) => {
                console.error("Error listening to collection:", error);
                loadingMessage.textContent = `เกิดข้อผิดพลาดในการโหลด: ${error.message}`;
            });
        }

        // ------------------ INITIALIZATION & UI MANAGEMENT ------------------

        /**
         * สลับโหมด UI ระหว่าง Sign In และ Sign Up
         */
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                authTitle.textContent = "สร้างบัญชีใหม่";
                authButton.textContent = "สร้างบัญชี";
                authToggle.innerHTML = "มีบัญชีอยู่แล้ว? <span class='font-semibold'>เข้าสู่ระบบ</span>";
            } else {
                authTitle.textContent = "เข้าสู่ระบบ";
                authButton.textContent = "เข้าสู่ระบบ";
                authToggle.innerHTML = "ยังไม่มีบัญชี? <span class='font-semibold'>สร้างบัญชีใหม่</span>";
            }
            showMessage(authMessage, "", "hidden");
        }

        /**
         * จัดการการแสดงผลหน้าจอ
         */
        function manageScreen(user) {
            if (user) {
                // ผู้ใช้ล็อกอินแล้ว: แสดงหน้าแอป
                userId = user.uid;
                isAuthReady = true;
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                userIdDisplay.textContent = `User ID: ${userId}`;
                loadRecords(); // เริ่มโหลดข้อมูลส่วนตัว
                console.log(`[App Status] User logged in: ${userId}`);
            } else {
                // ผู้ใช้ยังไม่อยู่ในระบบ: แสดงหน้า Login/Sign Up
                userId = null;
                isAuthReady = false;
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                console.log("[App Status] Showing Auth Screen.");
                // Reset Auth form state
                authButton.disabled = false;
                authButton.textContent = isSignUpMode ? "สร้างบัญชี" : "เข้าสู่ระบบ";
            }
        }
        
        /**
         * เริ่มต้นการทำงานของ Firebase App และ Listener
         */
        function initializeAppAndListeners() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // Listener หลักที่ควบคุมการเปลี่ยนหน้าจอทั้งหมด
                onAuthStateChanged(auth, manageScreen);

                // ตั้งค่าวันที่เริ่มต้น
                document.getElementById('recordDate').valueAsDate = new Date();
                
            } catch (error) {
                 showMessage(authMessage, `Error: ไม่สามารถเริ่มต้น Firebase App. ${error.message}`, "red");
                 console.error("Firebase Init Error:", error);
            }
        }

        // ------------------ EVENT LISTENERS ------------------

        authForm.addEventListener('submit', handleAuth);
        authToggle.addEventListener('click', toggleAuthMode);
        signOutButton.addEventListener('click', handleSignOut);
        recordForm.addEventListener('submit', saveRecord);

        recordsList.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const docId = e.target.getAttribute('data-id');
                if (docId) {
                    deleteRecord(docId);
                }
            }
        });
        
        // เริ่มต้นแอป
        initializeAppAndListeners();
    </script>
</body>
</html>
